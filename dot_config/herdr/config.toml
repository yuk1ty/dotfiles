onboarding = false
[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

# workspace
navigate_workspace_up = "ctrl+k"
navigate_workspace_down = "ctrl+j"

# agent
previous_agent = "prefix+,"
next_agent = "prefix+."

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[theme.custom]
accent = "#eba0ac"

[experimental]
switch_ascii_input_source_in_prefix = true
kitty_graphics = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "opencode", "cursor"]
